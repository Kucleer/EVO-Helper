<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EVO-Helper{% endblock %}</title>
  <link rel="stylesheet" href="/static/console.css">
  <script>
    window.EVOHelper = {
      async request(method, url, data) {
        const options = { method, headers: {} };
        if (data !== undefined) {
          options.headers['Content-Type'] = 'application/json';
          options.body = JSON.stringify(data);
        }
        const response = await fetch(url, options);
        if (!response.ok) {
          let detail = response.statusText;
          try { detail = (await response.json()).detail || detail; } catch (_) {}
          const error = new Error(detail);
          error.detail = detail;
          throw error;
        }
        return response.status === 204 ? null : response.json();
      },
      post(url, data) { return this.request('POST', url, data); },
      get(url) { return this.request('GET', url); },
      del(url) { return this.request('DELETE', url); },
    };

    document.addEventListener('submit', (event) => {
      const form = event.target;
      if (!form.matches('form[data-api]')) return;
      event.preventDefault();
      const data = {};
      for (const [key, value] of new FormData(form).entries()) data[key] = value;
      EVOHelper.post(form.dataset.api, data)
        .then(() => window.location.reload())
        .catch((error) => alert(error.detail || error.message));
    });
  </script>
</head>
<body>
<div class="shell">
  <nav class="sidenav" aria-label="主导航">
    <div class="brand">EVO&nbsp;HELPER</div>
    <a href="/missions" {% if active == 'missions' %}aria-current="page"{% endif %}>任务中心</a>
    <a href="/intel" {% if active == 'intel' %}aria-current="page"{% endif %}>情报中心</a>
    <a href="/planets" {% if active == 'planets' %}aria-current="page"{% endif %}>星球列表</a>
    <div class="group-label">辅助</div>
    <a href="/runs" {% if active == 'runs' %}aria-current="page"{% endif %}>运行详情</a>
    <a href="/logs" {% if active == 'logs' %}aria-current="page"{% endif %}>攻击日志</a>
    <a href="/diagnostics" {% if active == 'diagnostics' %}aria-current="page"{% endif %}>诊断</a>
  </nav>
  <div class="main">
    <header class="topbar">
      <h1>{% block heading %}EVO-Helper{% endblock %}</h1>
      <div class="spacer"></div>
      {% block topbar_extra %}{% endblock %}
      {#
        The dry-run lock is shown, never toggled. Turning it off is a
        deliberate Canary step outside this UI (see docs/safety.md).
      #}
      <span class="chip locked" title="演习模式：扫描、识别、记录照常，只是不点最终派遣。解锁需走单目标试运行流程，本界面不提供开关">
        <span class="glyph" aria-hidden="true">🔒</span>演习模式 已锁定
      </span>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
