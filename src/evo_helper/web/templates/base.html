<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EVO-Helper{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 1rem; }
    nav a { text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; }
    th, td { border: 1px solid #888; padding: 0.35rem 0.5rem; text-align: left; }
    .cards { display: flex; gap: 1rem; flex-wrap: wrap; }
    .card { border: 1px solid #888; border-radius: 6px; padding: 0.75rem 1rem; min-width: 8rem; }
    .card b { font-size: 1.6rem; display: block; }
    form.inline { display: inline; }
    .muted { color: #777; }
    .danger { color: #b00020; }
  </style>
  <script>
    window.EVOHelper = {
      async post(url, data) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!response.ok) {
          let detail = response.statusText;
          try { detail = (await response.json()).detail || detail; } catch (_) {}
          alert(detail);
          throw new Error(detail);
        }
        return response;
      },
    };
    document.addEventListener('submit', (event) => {
      const form = event.target;
      if (!form.matches('form[data-api]')) return;
      event.preventDefault();
      const data = {};
      for (const [key, value] of new FormData(form).entries()) data[key] = value;
      EVOHelper.post(form.dataset.api, data)
        .then(() => { window.location.reload(); })
        .catch(() => {});
    });
  </script>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/plans">Plans</a>
    <a href="/runs">Runs</a>
    <a href="/targets">Targets</a>
    <a href="/diagnostics">Diagnostics</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
