{% extends "base.html" %}
{% block title %}军力榜 · EVO-Helper{% endblock %}
{% block heading %}军力榜{% endblock %}
{% block content %}
<section class="panel compact"><div class="filter-bar">
  <input id="q" placeholder="名称 / bot 坐标" aria-label="名称">
  <input id="score-min" type="number" min="0" placeholder="最低军力" aria-label="最低军力">
  <input id="score-max" type="number" min="0" placeholder="最高军力" aria-label="最高军力">
  <select id="galaxy" aria-label="银河系"><option value="">全部银河系</option>{% for g in range(1, 10) %}<option value="{{ g }}">{{ g }} 系</option>{% endfor %}</select>
  <select id="kind" aria-label="类型"><option value="all">全部类型</option><option value="bot">bot</option><option value="pirate">海盗（1–4 位）</option><option value="player">玩家</option></select>
  <button class="btn primary small" id="search">筛选</button>
  <button class="btn small" type="button" id="reset">重置筛选</button>
</div><p class="muted" id="meta">尚无已持久化的军力榜快照。</p></section>
<section class="panel"><table><thead><tr><th>名称</th><th>军力值</th><th>坐标</th><th>类型</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
const e=(x)=>document.getElementById(x), val=(x)=>e(x).value.trim();
const local=(value)=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(value));
async function search(){const p=new URLSearchParams(); for(const [key,id] of [['q','q'],['score_min','score-min'],['score_max','score-max'],['galaxy','galaxy'],['kind','kind']]) if(val(id))p.set(key,val(id)); const data=await EVOHelper.get('/api/military-rankings?'+p); e('meta').textContent=data.captured_at_utc?`数据更新时间（UTC+8）：${local(data.captured_at_utc)} · 命中 ${data.total} 条`:'尚无已持久化的军力榜快照。'; e('rows').innerHTML=data.rows.map(r=>`<tr><td>${r.name}</td><td>${r.score??'—'}</td><td>${r.coordinate??'—'}</td><td>${r.kind}</td></tr>`).join('');}
function reset(){for(const id of ['q','score-min','score-max','galaxy'])e(id).value=''; e('kind').value='all'; search();} e('search').onclick=search; e('reset').onclick=reset; search();
</script>
{% endblock %}
