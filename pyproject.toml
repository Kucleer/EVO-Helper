[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evo-helper"
version = "0.1.0"
description = "Safety-first local assistant for auditable EVO scans and fleet dispatch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  # AI 选靶影子观测的 LLM 调用（全仓第一个对外网络调用）。版本区间与 dev 组
  # 那份一致，缺了也不让控制台起不来——`application/ai_targeting` 对缺依赖
  # 是 try-import 降级的，只是那一路观测失效。
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  # Unit tests build synthetic screenshots.  Keep Pillow here as well as in
  # ``vision``: CI intentionally installs only ``.[dev]``.
  "pillow>=10,<12",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
vision = [
  "mss>=9,<11",
  "opencv-python>=4.9,<5",
  "pillow>=10,<12",
  "pytesseract>=0.3.10,<1",
]
# 实机自动化：开窗口、认几何、真点鼠标。
#
# 这三个原先**一个都没声明**，全靠 venv 里手动装着。任何一次 `uv sync` 都会把
# 它们清掉（实机踩过：清掉之后网页服务起不来，报 No module named 'evo_helper'），
# 换台机器更是 `uv sync` 完了照样跑不起来——而这恰恰是部署到别的机器要解决的事。
live = [
  "pyautogui>=0.9.54,<1",
  "pywin32>=306",
]
# PostgreSQL 驱动。`EVO_HELPER_DATABASE_URL` 指向 `postgresql+psycopg://` 时必须装，
# 否则控制台在 `create_database_engine()` 就倒在 `ModuleNotFoundError: psycopg`。
#
# 走 `[binary]`（预编译轮子）而不是源码版：源码版要 libpq 和编译器，Windows 上装不上。
#
# 单开一组、不进主依赖：CI 与只跑测试的机器用临时 SQLite 库，装它纯属浪费；
# 而挂机那台机器 `uv sync` 时**必须**带上 `--extra db`——2026-08-16 切 PG 时
# psycopg 只是手动装在 venv 里、没进 `uv.lock`，任何一次 `uv sync` 都会把它清掉，
# 而清掉之后的症状是控制台起不来，不是「数据库连不上」这种一眼能认的报错。
db = [
  "psycopg[binary]>=3.2,<4",
]
# YOLO 单独一组：它拖 torch，几百 MB，而且只有 `vision/optional/yolo.py` 用得上，
# 实机链路一次都不碰。放在 vision 里会让 `uv sync --extra vision` 因为下载它超时
# 而整组装不上——实机就是这么卡住的。
yolo = [
  "ultralytics>=8.2,<9",
]

[project.scripts]
evo-capture = "evo_helper.tools.capture:main"
evo-dataset = "evo_helper.tools.dataset:main"
evo-web = "evo_helper.web.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# `tests` 也挂上：`tests/support/` 是测试之间共用的种子工具（`seed_run_instance`
# 要给 e2e 与 integration 两边用），不挂就得靠 conftest 收集顺序碰运气才能 import。
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# 归档的计划/规格文档：里面的 ```python 块是**故意的片段**——保留原文件里的缩进
# 用来指明「加在 BotLoop 里」，有的甚至只截了一行调用参数。ruff 0.16 起会格式化
# Markdown 里的代码块，套在这些片段上会把方法体拉平成模块级函数、把
# `target_kind=X,` 改写成 `target_kind = (X,)`，直接把文档改错。
# 这些计划已经执行完、属于历史记录，排除掉比改坏它们划算。
extend-exclude = ["docs/superpowers/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# `support` 是 `tests/support/`（测试共用的种子工具），不是装出来的第三方包。
# 不声明的话它会被排进 fastapi / sqlalchemy 那一段，读起来像个外部依赖。
known-first-party = ["support"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evo_helper"]

[[tool.mypy.overrides]]
# Optional vision/OS backends. CI installs only ".[dev]", so these are absent
# there and untyped when the "vision" extra is installed locally. One override
# covers both, which inline ignores cannot do without flipping error codes.
module = [
  "PIL.*",
  "cv2.*",
  "mss.*",
  "mss.tools.*",
  "pytesseract.*",
  "ultralytics.*",
  "win32api.*",
  "win32con.*",
  "win32gui.*",
  "win32process.*",
  "win32ui.*",
  "pyautogui.*",
]
ignore_missing_imports = true
