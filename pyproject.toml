[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evo-helper"
version = "0.1.0"
description = "Safety-first local assistant for auditable EVO scans and dry-run dispatch planning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
vision = [
  "mss>=9,<11",
  "opencv-python>=4.9,<5",
  "pytesseract>=0.3.10,<1",
  "ultralytics>=8.2,<9",
]

[project.scripts]
evo-capture = "evo_helper.tools.capture:main"
evo-dataset = "evo_helper.tools.dataset:main"
evo-web = "evo_helper.web.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evo_helper"]

[[tool.mypy.overrides]]
# Optional vision/OS backends. CI installs only ".[dev]", so these are absent
# there and untyped when the "vision" extra is installed locally. One override
# covers both, which inline ignores cannot do without flipping error codes.
module = [
  "PIL.*",
  "cv2.*",
  "mss.*",
  "mss.tools.*",
  "pytesseract.*",
  "ultralytics.*",
  "win32con.*",
  "win32gui.*",
  "win32ui.*",
]
ignore_missing_imports = true
