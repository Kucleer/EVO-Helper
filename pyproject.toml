[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evo-helper"
version = "0.1.0"
description = "Safety-first local assistant for auditable EVO scans and fleet dispatch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
vision = [
  "mss>=9,<11",
  "opencv-python>=4.9,<5",
  "pillow>=10,<12",
  "pytesseract>=0.3.10,<1",
]
# 实机自动化：开窗口、认几何、真点鼠标。
#
# 这三个原先**一个都没声明**，全靠 venv 里手动装着。任何一次 `uv sync` 都会把
# 它们清掉（实机踩过：清掉之后网页服务起不来，报 No module named 'evo_helper'），
# 换台机器更是 `uv sync` 完了照样跑不起来——而这恰恰是部署到别的机器要解决的事。
live = [
  "pyautogui>=0.9.54,<1",
  "pywin32>=306",
]
# YOLO 单独一组：它拖 torch，几百 MB，而且只有 `vision/optional/yolo.py` 用得上，
# 实机链路一次都不碰。放在 vision 里会让 `uv sync --extra vision` 因为下载它超时
# 而整组装不上——实机就是这么卡住的。
yolo = [
  "ultralytics>=8.2,<9",
]

[project.scripts]
evo-capture = "evo_helper.tools.capture:main"
evo-dataset = "evo_helper.tools.dataset:main"
evo-web = "evo_helper.web.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evo_helper"]

[[tool.mypy.overrides]]
# Optional vision/OS backends. CI installs only ".[dev]", so these are absent
# there and untyped when the "vision" extra is installed locally. One override
# covers both, which inline ignores cannot do without flipping error codes.
module = [
  "PIL.*",
  "cv2.*",
  "mss.*",
  "mss.tools.*",
  "pytesseract.*",
  "ultralytics.*",
  "win32api.*",
  "win32con.*",
  "win32gui.*",
  "win32process.*",
  "win32ui.*",
  "pyautogui.*",
]
ignore_missing_imports = true
